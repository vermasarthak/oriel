[project]
name = "oriel"
version = "0.1.0"
description = "Evaluation-driven model router for structured AI tasks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.28.0",
    "pandas>=2.1.0",
    "altair>=5.1.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]

