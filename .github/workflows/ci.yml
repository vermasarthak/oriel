name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: oriel
          POSTGRES_PASSWORD: oriel_dev_only
          POSTGRES_DB: oriel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oriel -d oriel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies (SQLite backend)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[postgres]" fastapi uvicorn pydantic httpx

    - name: Run tests (SQLite backend — default)
      run: python -m unittest discover -s tests -v

    - name: Run tests (Postgres backend)
      env:
        DATABASE_URL: postgresql://oriel:oriel_dev_only@localhost:5432/oriel
      run: python -m unittest discover -s tests -v
